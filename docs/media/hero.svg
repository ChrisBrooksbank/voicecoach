<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-label="VoiceCoach: find the volume the room is asking for">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d2420"/>
      <stop offset="1" stop-color="#12312b"/>
    </linearGradient>
    <linearGradient id="band" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#81c9b7" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#81c9b7" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#81c9b7" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="380" rx="18" fill="url(#bg)"/>
  <!-- the target band: the zone the room is asking for -->
  <rect x="0" y="150" width="1200" height="80" fill="url(#band)"/>
  <line x1="0" y1="150" x2="1200" y2="150" stroke="#66a977" stroke-opacity="0.35" stroke-dasharray="4 8"/>
  <line x1="0" y1="230" x2="1200" y2="230" stroke="#66a977" stroke-opacity="0.35" stroke-dasharray="4 8"/>
  <!-- waveform: too quiet, in range, too loud, back in range -->
  <g stroke-linecap="round" stroke-width="10">
    <g stroke="#5d98ca">
      <line x1="620" y1="182" x2="620" y2="198"/><line x1="640" y1="178" x2="640" y2="202"/>
      <line x1="660" y1="184" x2="660" y2="196"/><line x1="680" y1="176" x2="680" y2="204"/>
      <line x1="700" y1="180" x2="700" y2="200"/>
    </g>
    <g stroke="#66a977">
      <line x1="720" y1="160" x2="720" y2="220"/><line x1="740" y1="152" x2="740" y2="228"/>
      <line x1="760" y1="164" x2="760" y2="216"/><line x1="780" y1="155" x2="780" y2="225"/>
      <line x1="800" y1="160" x2="800" y2="220"/>
    </g>
    <g stroke="#d99135">
      <line x1="820" y1="110" x2="820" y2="270"/><line x1="840" y1="90" x2="840" y2="290"/>
      <line x1="860" y1="104" x2="860" y2="276"/><line x1="880" y1="86" x2="880" y2="294"/>
      <line x1="900" y1="118" x2="900" y2="262"/>
    </g>
    <g stroke="#66a977">
      <line x1="920" y1="158" x2="920" y2="222"/><line x1="940" y1="153" x2="940" y2="227"/>
      <line x1="960" y1="162" x2="960" y2="218"/><line x1="980" y1="154" x2="980" y2="226"/>
      <line x1="1000" y1="160" x2="1000" y2="220"/><line x1="1020" y1="166" x2="1020" y2="214"/>
      <line x1="1040" y1="172" x2="1040" y2="208"/><line x1="1060" y1="178" x2="1060" y2="202"/>
      <line x1="1080" y1="184" x2="1080" y2="196"/>
    </g>
  </g>
  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
    <text x="64" y="112" fill="#81c9b7" font-size="20" font-weight="700" letter-spacing="4">VOICECOACH</text>
    <text x="64" y="186" fill="#f6f2e8" font-size="56" font-weight="800">Not too quiet.</text>
    <text x="64" y="250" fill="#f6f2e8" font-size="56" font-weight="800">Not too loud.</text>
    <text x="64" y="306" fill="#a9c9bf" font-size="24" font-weight="500">Just right for the room you're in.</text>
  </g>
</svg>
